<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNOX ADMIN PANEL</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #222; }
        .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #111; border: 1px solid #222; padding: 1.5rem; border-radius: 8px; }
        .stat-card h3 { font-size: 2rem; font-family: var(--font-mono); color: var(--accent-gold); margin-top: 10px; }
        .action-bar { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
        .input-field { background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-family: var(--font-mono); }
        .status-active { color: var(--accent-green); }
        .status-inactive { color: var(--text-muted); }
    </style>
</head>
<body style="background: var(--bg-dark); padding: 20px;">
    <div class="admin-container">
        
        <div class="admin-header">
            <h1 class="font-head">KNOX LOCAL DEMO MANAGEMENT</h1>
            <a href="index.html" class="btn" style="width: auto; padding: 10px 20px; text-decoration: none;">BACK TO CLIENT</a>
        </div>

        <div class="dashboard-stats">
            <div class="stat-card">
                <span class="text-muted">TOTAL LICENSES</span>
                <h3 id="stat-total">0</h3>
            </div>
            <div class="stat-card">
                <span class="text-muted">STATUS</span>
                <h3 class="status-active">ONLINE</h3>
            </div>
        </div>

        <div class="action-bar">
            <input type="text" id="new-key-input" class="input-field" placeholder="KNOX-XXXX-XXXX" style="flex: 1;">
            <button class="btn" style="width: auto;" onclick="addKey()">ADD LICENSE</button>
            <button class="btn btn-outline" style="width: auto;" onclick="generateBulk()">GENERATE 5 KEYS</button>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>LICENSE KEY</th>
                    <th>STATUS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="license-table-body">
                <!-- Populated by JS -->
            </tbody>
        </table>

        <div style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
            ⚠️ This is a frontend-only demo. Data is stored in LocalStorage. For production, connect this UI to a secure backend API.
        </div>
    </div>

    <script>
        const LICENSE_DB = 'knox_licenses';

        function loadTable() {
            const keys = JSON.parse(localStorage.getItem(LICENSE_DB)) || [];
            const tbody = document.getElementById('license-table-body');
            tbody.innerHTML = '';
            
            document.getElementById('stat-total').innerText = keys.length;

            keys.forEach((key, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: #fff; font-weight: bold;">${key}</td>
                    <td class="status-active">ACTIVE</td>
                    <td>
                        <button class="btn btn-outline" style="padding: 5px 10px; font-size: 0.7rem; width: auto; display: inline-block;" onclick="copyAdminKey('${key}')">COPY</button>
                        <button class="btn" style="padding: 5px 10px; font-size: 0.7rem; width: auto; display: inline-block; background: #2a1111; color: #ff4444;" onclick="deleteKey(${index})">DELETE</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addKey() {
            const input = document.getElementById('new-key-input');
            const val = input.value.trim().toUpperCase();
            
            if (!val) return alert("Enter a valid key format.");
            
            let keys = JSON.parse(localStorage.getItem(LICENSE_DB)) || [];
            
            if (keys.includes(val)) {
                return alert("This key already exists.");
            }

            keys.push(val);
            localStorage.setItem(LICENSE_DB, JSON.stringify(keys));
            input.value = '';
            loadTable();
        }

        function deleteKey(index) {
            if (!confirm("Are you sure you want to delete this key?")) return;
            let keys = JSON.parse(localStorage.getItem(LICENSE_DB)) || [];
            keys.splice(index, 1);
            localStorage.setItem(LICENSE_DB, JSON.stringify(keys));
            loadTable();
        }

        function generateBulk() {
            let keys = JSON.parse(localStorage.getItem(LICENSE_DB)) || [];
            
            for(let i=0; i<5; i++) {
                let part1 = Math.random().toString(36).substring(2, 6).toUpperCase();
                let part2 = Math.random().toString(36).substring(2, 6).toUpperCase();
                let newKey = `KNOX-${part1}-${part2}`;
                if(!keys.includes(newKey)) keys.push(newKey);
            }

            localStorage.setItem(LICENSE_DB, JSON.stringify(keys));
            loadTable();
        }

        function copyAdminKey(key) {
            navigator.clipboard.writeText(key).then(() => alert(`Copied ${key}`));
        }

        // Init
        loadTable();
    </script>
</body>
</html>
